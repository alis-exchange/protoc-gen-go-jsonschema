syntax = "proto3";

package users.v1;

import "alis/open/options/v1/options.proto";
import "google/iam/admin/v1/iam.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "example.com/users/v1;usersv1";
option (alis.open.options.v1.file).json_schema.generate = true;

message Common {
  string id = 1;
  string name = 2;
  string email = 3;
  string phone = 4;
  string address = 5;
  string city = 6;
  string state = 7;
  string zip = 8;
  string country = 9;
  google.iam.admin.v1.ServiceAccountKey service_account_key = 11;
  // A Google type with a proto oneof (lint_object): rendered with a PascalCase wrapper, like user messages.
  optional google.iam.admin.v1.LintPolicyRequest lint_policy_request = 12;
}

// Request message for CompleteInterview.
message CompleteInterviewRequest {
  string finish_reason = 1 [(alis.open.options.v1.field).json_schema = {description: "The reason the interview is complete: the research plan was fully covered, the participant said they were done, or the participant could not continue."}];

  // A short, participant-facing recap of what this participant shared, shown to
  // them on the completion screen. Populate it from the whole interview when you
  // complete — second person, their own words, no research-plan jargon.
  InterviewSummary summary = 2 [(alis.open.options.v1.field).json_schema = {description: "A short participant-facing recap of what the participant shared, shown to them on the completion screen. Fill it from the whole interview, in the participant's own framing."}];

  // A participant-facing recap of an interview contribution.
  message InterviewSummary {
    string headline = 1 [(alis.open.options.v1.field).json_schema = {description: "One warm sentence naming what the participant helped with, in their own words (not the team's jargon)."}];
    repeated string points = 2 [(alis.open.options.v1.field).json_schema = {description: "3-5 short bullets, each a concrete thing the participant told you, in second person (e.g. 'You walked through the morning reconciliation across three stores')."}];
  }
}

// Opted out of generation here; generated anyway because
// ParentWithCrossFileDependency in force.proto references it.
message CrossFileDependency {
  option (alis.open.options.v1.message).json_schema.generate = false;

  string value = 1;
}
