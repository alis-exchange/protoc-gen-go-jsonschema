syntax = "proto3";

package options_demo.v1;

import "alis/open/options/v1/options.proto";

option go_package = "example.com/options_demo/v1;optionsdemov1";
option (alis.open.options.v1.file).json_schema.generate = true;

// CheckoutRequest mirrors an LLM-facing request with mutually exclusive
// payment shapes: exactly one of the three payment fields must be set, and at
// most one of promo_code/gift_card_code may be set.
message CheckoutRequest {
  option (alis.open.options.v1.message).json_schema.oneof = {
    fields: ["card", "bank_transfer", "mobile_money"],
    required: true
  };
  option (alis.open.options.v1.message).json_schema.oneof = {
    fields: ["promo_code", "gift_card_code"]
  };

  // Pay with a saved card.
  Card card = 1;
  // Pay by bank transfer.
  BankTransfer bank_transfer = 2;
  // Pay with mobile money.
  MobileMoney mobile_money = 3;

  // Optional promotional code.
  string promo_code = 4;
  // Optional gift card code.
  string gift_card_code = 5;
}

// Card selects a saved card to charge.
message Card {
  // Card expiry year.
  int64 expiry_year = 1 [(alis.open.options.v1.field).json_schema = {
    minimum: 2000,
    maximum: 2100
  }];
}

// BankTransfer selects a bank transfer payment.
message BankTransfer {
  // Settlement currency.
  string currency = 1 [(alis.open.options.v1.field).json_schema = {
    enum_string: ["USD", "EUR", "KES"]
  }];
}

// MobileMoney selects a mobile money payment.
message MobileMoney {
  // Amount in cents; must be greater than 0.
  int64 amount_cents = 1 [(alis.open.options.v1.field).json_schema = {
    minimum: 0,
    exclusive_minimum: true,
    maximum: 500000
  }];
}

// KeywordShowcase exercises every new field option on happy paths.
message KeywordShowcase {
  // Weekday index.
  int32 weekday = 1 [(alis.open.options.v1.field).json_schema = {
    enum_int: [0, 1, 2, 3, 4, 5, 6],
    default_int: 1,
    examples_int: [1, 5]
  }];

  // Sampling rate.
  double rate = 2 [(alis.open.options.v1.field).json_schema = {
    enum_number: [0.25, 0.5, 1],
    default_number: 0.5,
    examples_number: [0.25, 1]
  }];

  // Output mode.
  string mode = 3 [(alis.open.options.v1.field).json_schema = {
    enum_string: ["compact", "detailed"],
    default_string: "compact",
    examples_string: ["compact"]
  }];

  // Verbose flag.
  bool verbose = 4 [(alis.open.options.v1.field).json_schema = {
    default_bool: true
  }];

  // Step size in items.
  int64 step = 5 [(alis.open.options.v1.field).json_schema = {
    multiple_of: 5
  }];

  // Legacy identifier, kept for backwards compatibility.
  string legacy_id = 6 [(alis.open.options.v1.field).json_schema = {
    deprecated: true,
    write_only: true
  }];

  // Server-assigned entity tag.
  string etag = 7 [(alis.open.options.v1.field).json_schema = {
    read_only: true
  }];

  // Tags: enum_string constrains each element; deprecated marks the array
  // itself; min_items 0 exercises presence-based zero bounds.
  repeated string tags = 8 [(alis.open.options.v1.field).json_schema = {
    enum_string: ["a", "b", "c"],
    deprecated: true,
    min_items: 0
  }];

  // Status narrowed to a subset of the enum's declared values.
  Status status = 9 [(alis.open.options.v1.field).json_schema = {
    enum_int: [1, 2],
    default_int: 1
  }];

  // Superseded card reference; the annotation and description ride the
  // $ref as sibling keywords.
  Card legacy_card = 10 [(alis.open.options.v1.field).json_schema = {
    deprecated: true,
    description: "Use CheckoutRequest.card instead."
  }];

  // Status of the showcase entity.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_ACTIVE = 1;
    STATUS_INACTIVE = 2;
  }
}

// RealOneofDemo declares a json_schema.oneof group whose members belong to a
// real proto oneof block (presence is expressed through the PascalCase
// wrapper property).
message RealOneofDemo {
  option (alis.open.options.v1.message).json_schema.oneof = {
    fields: ["by_id", "by_name"],
    required: true
  };

  oneof selector {
    // Numeric id selector.
    int64 by_id = 1;
    // Name selector.
    string by_name = 2;
  }
}
