syntax = "proto3";

package options_demo.v1;

import "alis/open/options/v1/options.proto";

option go_package = "example.com/options_demo/v1;optionsdemov1";
option (alis.open.options.v1.file).json_schema.generate = true;

// CheckoutRequest mirrors an LLM-facing request with mutually exclusive
// payment shapes: exactly one of the three payment fields must be set, and at
// most one of promo_code/gift_card_code may be set.
message CheckoutRequest {
  option (alis.open.options.v1.message).json_schema.oneof = {
    fields: ["card", "bank_transfer", "mobile_money"],
    required: true
  };
  option (alis.open.options.v1.message).json_schema.oneof = {
    fields: ["promo_code", "gift_card_code"]
  };

  // Pay with a saved card.
  Card card = 1;
  // Pay by bank transfer.
  BankTransfer bank_transfer = 2;
  // Pay with mobile money.
  MobileMoney mobile_money = 3;

  // Optional promotional code.
  string promo_code = 4;
  // Optional gift card code.
  string gift_card_code = 5;
}

// Card selects a saved card to charge.
message Card {
  // Card expiry year.
  int64 expiry_year = 1 [(alis.open.options.v1.field).json_schema = {
    minimum: 2000,
    maximum: 2100
  }];
}

// BankTransfer selects a bank transfer payment.
message BankTransfer {
  // Settlement currency.
  string currency = 1 [(alis.open.options.v1.field).json_schema = {
    enum_string: ["USD", "EUR", "KES"]
  }];
}

// MobileMoney selects a mobile money payment.
message MobileMoney {
  // Amount in cents; must be greater than 0.
  int64 amount_cents = 1 [(alis.open.options.v1.field).json_schema = {
    minimum: 0,
    exclusive_minimum: true,
    maximum: 500000
  }];
}

// KeywordShowcase exercises every new field option on happy paths.
message KeywordShowcase {
  // Weekday index.
  int32 weekday = 1 [(alis.open.options.v1.field).json_schema = {
    enum_int: [0, 1, 2, 3, 4, 5, 6],
    default_int: 1,
    examples_int: [1, 5]
  }];

  // Sampling rate.
  double rate = 2 [(alis.open.options.v1.field).json_schema = {
    enum_number: [0.25, 0.5, 1],
    default_number: 0.5,
    examples_number: [0.25, 1]
  }];

  // Output mode.
  string mode = 3 [(alis.open.options.v1.field).json_schema = {
    enum_string: ["compact", "detailed"],
    default_string: "compact",
    examples_string: ["compact"]
  }];

  // Verbose flag.
  bool verbose = 4 [(alis.open.options.v1.field).json_schema = {
    default_bool: true
  }];

  // Step size in items.
  int64 step = 5 [(alis.open.options.v1.field).json_schema = {
    multiple_of: 5
  }];

  // Legacy identifier, kept for backwards compatibility.
  string legacy_id = 6 [(alis.open.options.v1.field).json_schema = {
    deprecated: true,
    write_only: true
  }];

  // Server-assigned entity tag.
  string etag = 7 [(alis.open.options.v1.field).json_schema = {
    read_only: true
  }];

  // Tags: enum_string constrains each element; deprecated marks the array
  // itself; min_items 0 exercises presence-based zero bounds.
  repeated string tags = 8 [(alis.open.options.v1.field).json_schema = {
    enum_string: ["a", "b", "c"],
    deprecated: true,
    min_items: 0
  }];

  // Status narrowed to a subset of the enum's declared values.
  Status status = 9 [(alis.open.options.v1.field).json_schema = {
    enum_int: [1, 2],
    default_int: 1
  }];

  // Superseded card reference; the annotation and description ride the
  // $ref as sibling keywords.
  Card legacy_card = 10 [(alis.open.options.v1.field).json_schema = {
    deprecated: true,
    description: "Use CheckoutRequest.card instead."
  }];

  // Status of the showcase entity.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_ACTIVE = 1;
    STATUS_INACTIVE = 2;
  }
}

// RealOneofDemo declares a json_schema.oneof group whose members belong to a
// real proto oneof block (presence is expressed through the PascalCase
// wrapper property).
message RealOneofDemo {
  option (alis.open.options.v1.message).json_schema.oneof = {
    fields: ["by_id", "by_name"],
    required: true
  };

  oneof selector {
    // Numeric id selector.
    int64 by_id = 1;
    // Name selector.
    string by_name = 2;
  }
}

// AnnotationShowcase covers the annotation-style options on singular fields —
// title/description overrides, format, content encoding and media type — plus
// ignore and a lone exclusive upper bound. The comments here are deliberately
// replaced by the options.
message AnnotationShowcase {
  // Comment that the title and description options replace.
  string display_name = 1 [(alis.open.options.v1.field).json_schema = {
    title: "Display name",
    description: "Shown in the UI; overrides the comment."
  }];

  // Contact email address.
  string email = 2 [(alis.open.options.v1.field).json_schema = {
    format: "email",
    min_length: 3,
    max_length: 254
  }];

  // JSON document carried as a base64 string.
  string payload = 3 [(alis.open.options.v1.field).json_schema = {
    content_encoding: "base64",
    content_media_type: "application/json"
  }];

  // Raw bytes whose default base64 encoding is overridden.
  bytes digest = 4 [(alis.open.options.v1.field).json_schema = {
    content_encoding: "base16",
    content_media_type: "application/octet-stream"
  }];

  // Internal bookkeeping: excluded from the schema and from required.
  string internal_note = 5 [(alis.open.options.v1.field).json_schema = {
    ignore: true
  }];

  // Strictly below 1 (exclusive_minimum is covered by MobileMoney).
  double ratio = 6 [(alis.open.options.v1.field).json_schema = {
    maximum: 1,
    exclusive_maximum: true
  }];
}

// ElementShowcase covers options on repeated and map fields: value
// constraints land on items / additionalProperties, container constraints and
// annotations on the array or object itself.
message ElementShowcase {
  // One to three distinct lowercase slugs.
  repeated string slugs = 1 [(alis.open.options.v1.field).json_schema = {
    pattern: "^[a-z][a-z0-9-]*$",
    min_length: 1,
    max_length: 16,
    min_items: 1,
    max_items: 3,
    unique_items: true
  }];

  // Per-key quotas: each value in [1, 100] and a multiple of 5; one to four
  // keys.
  map<string, int64> quotas = 2 [(alis.open.options.v1.field).json_schema = {
    minimum: 1,
    maximum: 100,
    multiple_of: 5,
    min_properties: 1,
    max_properties: 4
  }];

  // Contact emails keyed by role: format applies to each value, title to the
  // map.
  map<string, string> contacts = 3 [(alis.open.options.v1.field).json_schema = {
    format: "email",
    title: "Contacts by role"
  }];

  // Per-region status narrowed to a subset of the enum; the map itself is
  // read-only.
  map<string, KeywordShowcase.Status> region_status = 4 [(alis.open.options.v1.field).json_schema = {
    enum_int: [1, 2],
    read_only: true
  }];

  // Attachments: each element's encoding overrides the base64 default; the
  // array is write-only.
  repeated bytes attachments = 5 [(alis.open.options.v1.field).json_schema = {
    content_encoding: "base16",
    content_media_type: "image/png",
    write_only: true
  }];

  // Ratios in (0, 1]: the exclusive lower bound applies to each element.
  repeated double ratios = 6 [(alis.open.options.v1.field).json_schema = {
    minimum: 0,
    exclusive_minimum: true,
    maximum: 1
  }];
}

// DecorationShowcase covers options on message-typed fields and on oneof
// variants: a message field decorates the schema its reference returns, and
// variant options land inside the PascalCase wrapper.
message DecorationShowcase {
  // Card decorated with a title (replacing Card's own title and description
  // on the inline copy), a property bound and an annotation.
  Card primary_card = 1 [(alis.open.options.v1.field).json_schema = {
    title: "Primary card",
    min_properties: 1,
    read_only: true
  }];

  oneof lookup {
    // Numeric id: bound, default and examples on a scalar variant.
    int64 by_id = 2 [(alis.open.options.v1.field).json_schema = {
      minimum: 1,
      default_int: 1,
      examples_int: [1, 42]
    }];
    // Slug: pattern and title on a scalar variant.
    string by_slug = 3 [(alis.open.options.v1.field).json_schema = {
      pattern: "^[a-z-]+$",
      title: "Slug"
    }];
    // Bank details: description and deprecated decorate the inline copy.
    BankTransfer by_bank = 4 [(alis.open.options.v1.field).json_schema = {
      description: "Deprecated lookup by settlement details.",
      deprecated: true
    }];
    // Excluded from the wrapper entirely.
    string by_legacy_key = 5 [(alis.open.options.v1.field).json_schema = {
      ignore: true
    }];
  }
}

// SubsetOneofDemo declares a required group over a subset of a proto oneof's
// members: setting the uncovered variant is a legal proto value that fails
// the schema.
message SubsetOneofDemo {
  option (alis.open.options.v1.message).json_schema.oneof = {
    fields: ["by_email", "by_phone"],
    required: true
  };

  oneof contact {
    string by_email = 1;
    string by_phone = 2;
    // Not covered by the group.
    string by_pager = 3;
  }
}
